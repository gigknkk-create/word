<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NCERT Class 8 History — Vocabulary Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Bundled Class 8 Vocabulary Dataset -->
  <script src="datasets/class_08_data.js"></script>
  <script src="datasets/class_09_english_kaveri_data.js"></script>
  <script src="datasets/class_10_english_first_flight_data.js"></script>
  <script src="datasets/class_10_english_footprints_without_feet_data.js"></script>
  <script src="datasets/class_11_english_hornbill_data.js"></script>
  <script src="datasets/class_11_english_snapshots_data.js"></script>
  <script src="datasets/class_12_english_flamingo_data.js"></script>
  <script src="datasets/class_12_english_vistas_data.js"></script>
  <style>
    :root {
      --bg-body: #090d16;
      --bg-surface: #0f172a;
      --bg-surface-elevated: #1e293b;
      --bg-surface-hover: #24344d;
      --border: rgba(148, 163, 184, 0.12);
      --border-focus: #818cf8;
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --text-hindi: #fef08a;

      --accent-indigo: #6366f1;
      --accent-violet: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-emerald: #10b981;

      --tag-med-bg: rgba(245, 158, 11, 0.12);
      --tag-med-text: #fbbf24;
      --tag-med-border: rgba(245, 158, 11, 0.28);

      --tag-hard-bg: rgba(244, 63, 94, 0.12);
      --tag-hard-text: #fb7185;
      --tag-hard-border: rgba(244, 63, 94, 0.28);

      --pos-bg: rgba(99, 102, 241, 0.12);
      --pos-text: #a5b4fc;
      --pos-border: rgba(99, 102, 241, 0.25);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-full: 9999px;

      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.2);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 2px 4px -2px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #151c33 0%, var(--bg-body) 65%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* Top Sticky Navigation Bar */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-badge-icon {
      width: 40px;
      height: 40px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }

    .brand-meta h1 {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #fff;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .class-tag {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 2px 8px;
      border-radius: var(--radius-full);
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #c7d2fe;
    }

    .book-selector-container {
      margin-left: 12px;
    }
    .book-select-dropdown {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border);
      color: #f8fafc;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: var(--radius-md);
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .book-select-dropdown:hover, .book-select-dropdown:focus {
      border-color: var(--accent-indigo);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }

    /* Header Nav Controls */
    .header-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-surface-elevated);
      padding: 4px 6px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .btn-icon-nav {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      width: 32px;
      height: 32px;
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s ease;
    }

    .btn-icon-nav:hover:not(:disabled) {
      background: var(--accent-indigo);
      color: #fff;
    }

    .btn-icon-nav:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .page-indicator-form {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 0 4px;
    }

    .page-input {
      width: 48px;
      height: 30px;
      background: var(--bg-body);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: all 0.15s;
    }

    .page-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }

    .btn-go {
      background: var(--accent-indigo);
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-go:hover {
      background: #4f46e5;
    }

    /* Header Actions */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-wrapper {
      position: relative;
    }

    .search-input {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: #fff;
      padding: 7px 14px 7px 34px;
      font-size: 13px;
      width: 200px;
      outline: none;
      transition: all 0.2s;
    }

    .search-input:focus {
      width: 260px;
      border-color: var(--border-focus);
      background: var(--bg-surface);
    }

    .search-icon-svg {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .btn-action {
      background: var(--bg-surface-elevated);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 7px 12px;
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none;
    }

    .btn-action:hover {
      background: var(--bg-surface-hover);
      border-color: rgba(148, 163, 184, 0.3);
      color: #fff;
    }

    /* Sub-header Banner & Quick Stats */
    .hero-banner {
      max-width: 1320px;
      width: 100%;
      margin: 20px auto 14px auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .chapter-badge-box {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .chapter-title-text {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chapter-sub-text {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      padding: 3px 10px;
      border-radius: var(--radius-full);
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
    }

    /* Filter & View Switcher Bar */
    .controls-bar {
      max-width: 1320px;
      width: 100%;
      margin: 0 auto 16px auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
    }

    .filter-tabs {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-btn {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: var(--radius-md);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .filter-btn:hover {
      color: #fff;
      border-color: rgba(148, 163, 184, 0.3);
    }

    .filter-btn.active {
      background: var(--accent-indigo);
      border-color: var(--accent-indigo);
      color: #fff;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.3);
    }

    .view-switcher {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg-surface);
      padding: 3px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    .view-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      padding: 5px 12px;
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .view-btn.active {
      background: var(--bg-surface-elevated);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }

    /* Main Table Container */
    .content-area {
      max-width: 1320px;
      width: 100%;
      margin: 0 auto 30px auto;
      padding: 0 24px;
      flex: 1;
    }

    .table-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 13.5px;
    }

    thead th {
      background: rgba(15, 23, 42, 0.95);
      color: var(--text-secondary);
      font-weight: 700;
      font-size: 11.5px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
      user-select: none;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background-color 0.15s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: rgba(30, 41, 59, 0.6);
    }

    td {
      padding: 16px 18px;
      vertical-align: middle;
    }

    .td-num {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      width: 40px;
    }

    /* Word Cell */
    .word-cell {
      display: flex;
      flex-direction: column;
      gap: 5px;
      min-width: 140px;
    }

    .word-name {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .word-tags {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .pos-pill {
      font-size: 10.5px;
      font-weight: 600;
      text-transform: capitalize;
      background: var(--pos-bg);
      color: var(--pos-text);
      border: 1px solid var(--pos-border);
      padding: 1px 7px;
      border-radius: var(--radius-sm);
    }

    .category-badge {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      display: inline-block;
      white-space: nowrap;
    }

    .category-badge.Medium {
      background: var(--tag-med-bg);
      color: var(--tag-med-text);
      border: 1px solid var(--tag-med-border);
    }

    .category-badge.Hard {
      background: var(--tag-hard-bg);
      color: var(--tag-hard-text);
      border: 1px solid var(--tag-hard-border);
    }

    /* Pronunciation Cell */
    .pron-cell {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 130px;
    }

    .ipa-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: #93c5fd;
      background: rgba(147, 197, 253, 0.08);
      padding: 1px 6px;
      border-radius: var(--radius-sm);
      display: inline-block;
      width: fit-content;
    }

    .pron-hindi-text {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #fde047;
    }

    .btn-audio {
      background: rgba(99, 102, 241, 0.12);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
      border-radius: var(--radius-full);
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      width: fit-content;
      margin-top: 2px;
      transition: all 0.15s;
    }

    .btn-audio:hover {
      background: var(--accent-indigo);
      color: #fff;
    }

    /* Hindi Meaning Cell */
    .hindi-meaning-cell {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-size: 15px;
      font-weight: 700;
      color: var(--text-hindi);
      min-width: 180px;
      line-height: 1.45;
    }

    /* English Meaning Cell */
    .english-meaning-cell {
      font-size: 13px;
      color: #e2e8f0;
      line-height: 1.45;
      min-width: 220px;
    }

    /* Example Sentence Cell */
    .example-cell {
      font-size: 12.5px;
      color: #94a3b8;
      font-style: italic;
      line-height: 1.45;
      min-width: 240px;
      background: rgba(15, 23, 42, 0.4);
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border-left: 2px solid var(--accent-indigo);
    }

    .example-cell strong {
      color: #38bdf8;
      font-style: normal;
      font-weight: 700;
    }

    /* Grid / Card View Mode */
    .grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 16px;
    }

    .vocab-card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: var(--shadow-md);
      transition: all 0.15s;
    }

    .vocab-card:hover {
      transform: translateY(-2px);
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: var(--shadow-lg);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    /* JSON Viewer */
    .json-card {
      background: #0d1117;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 20px;
      position: relative;
    }

    pre code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      color: #7dd3fc;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Search Results Dropdown */
    .search-results-popover {
      position: absolute;
      top: 56px;
      right: 24px;
      width: 360px;
      max-height: 440px;
      overflow-y: auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-focus);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-lg);
      z-index: 200;
      display: none;
    }

    .search-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      transition: background 0.15s;
    }

    .search-item:hover {
      background: var(--bg-surface-hover);
    }

    .search-item-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .search-item-word {
      font-size: 14.5px;
      font-weight: 700;
      color: #fff;
    }

    .search-item-page {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: var(--radius-sm);
      background: rgba(99, 102, 241, 0.2);
      color: #c7d2fe;
    }

    .search-item-hindi {
      font-family: 'Noto Sans Devanagari', sans-serif;
      font-size: 12.5px;
      color: var(--text-hindi);
    }

    /* Empty State */
    .empty-state {
      padding: 80px 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: var(--text-secondary);
    }

    .empty-icon {
      font-size: 48px;
      opacity: 0.6;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 28px;
      right: 28px;
      background: var(--accent-emerald);
      color: #fff;
      padding: 10px 20px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-weight: 700;
      box-shadow: var(--shadow-lg);
      display: none;
      z-index: 300;
      animation: toastIn 0.2s ease-out;
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 800px) {
      header {
        flex-wrap: wrap;
        padding: 10px 14px;
      }
      .brand-sub {
        display: none;
      }
      .hero-banner, .controls-bar, .content-area {
        padding: 0 14px;
      }
      .search-input {
        width: 140px;
      }
      .search-input:focus {
        width: 180px;
      }
    }
  </style>
</head>
<body>

  <!-- Sticky Top Header -->
  <header>
    <div class="brand-group">
      <div class="brand-badge-icon" id="brand-icon">📖</div>
      <div class="brand-meta">
        <h1>
          NCERT VocabStudio
          <span class="class-tag" id="class-tag-badge">Class 8 History</span>
        </h1>
        <div class="brand-sub" id="brand-sub">Our Pasts - III • Interactive Vocabulary Table</div>
      </div>
      <div class="book-selector-container">
        <select id="book-select" class="book-select-dropdown" aria-label="Select Textbook">
          <option value="class_08">📘 Class 8: History (Our Pasts III)</option>
          <option value="class_09">📙 Class 9: English (Kaveri)</option>
          <option value="class_10_ff">📕 Class 10: First Flight</option>
          <option value="class_10_fp">📗 Class 10: Footprints Without Feet</option>
          <option value="class_11_hb">📓 Class 11: Hornbill</option>
          <option value="class_11_sn">📔 Class 11: Snapshots</option>
          <option value="class_12_fl">📕 Class 12: Flamingo</option>
          <option value="class_12_vs">📘 Class 12: Vistas</option>
        </select>
      </div>
    </div>

    <!-- Central Page Controls & Quick Jump -->
    <div class="header-nav">
      <button class="btn-icon-nav" id="btn-first" title="First Page">⏮</button>
      <button class="btn-icon-nav" id="btn-prev" title="Previous Page">◀</button>
      
      <div class="page-indicator-form">
        <span>Page</span>
        <input type="number" id="page-input" class="page-input" min="1" max="124" value="1">
        <span>/ <span id="max-page-label">124</span></span>
      </div>

      <button class="btn-go" id="btn-go">Go</button>
      <button class="btn-icon-nav" id="btn-next" title="Next Page">▶</button>
      <button class="btn-icon-nav" id="btn-last" title="Last Page">⏭</button>
    </div>

    <!-- Header Actions -->
    <div class="header-actions">
      <!-- Search -->
      <div class="search-wrapper">
        <svg class="search-icon-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="search-input" class="search-input" placeholder="Search 1,150 words or Hindi...">
      </div>

      <!-- Copy JSON -->
      <button class="btn-action" id="btn-copy-page" title="Copy Current Page JSON">
        📋 Copy JSON
      </button>

      <!-- Download Dataset -->
      <button class="btn-action" id="btn-download-all" title="Download Full Class 8 JSON Dataset">
        📥 Download
      </button>
    </div>
  </header>

  <!-- Search Popover -->
  <div class="search-results-popover" id="search-popover"></div>

  <!-- Hero Chapter Banner -->
  <div class="hero-banner">
    <div class="chapter-badge-box">
      <div class="chapter-title-text" id="chapter-title">
        📖 Prelims & Introduction
      </div>
      <div class="chapter-sub-text">
        <span class="stat-chip" id="page-stat-badge">📄 Page 1</span>
        <span class="stat-chip" id="words-stat-badge">📝 10 Words</span>
        <span class="stat-chip" id="book-stat-badge">✨ Class 8 History NCERT</span>
      </div>
    </div>
  </div>

  <!-- Filter & View Controls -->
  <div class="controls-bar">
    <!-- Category Filter Pills -->
    <div class="filter-tabs">
      <button class="filter-btn active" data-filter="all" id="pill-all">All Words (10)</button>
      <button class="filter-btn" data-filter="Medium" id="pill-med">Medium</button>
      <button class="filter-btn" data-filter="Hard" id="pill-hard">Hard</button>
    </div>

    <!-- View Switcher -->
    <div class="view-switcher">
      <button class="view-btn active" id="view-table-btn">📊 Table View</button>
      <button class="view-btn" id="view-cards-btn">🎴 Cards View</button>
      <button class="view-btn" id="view-json-btn">💻 JSON</button>
    </div>
  </div>

  <!-- Content Container -->
  <main class="content-area">
    <!-- Mode 1: Aesthetic Table View (Default) -->
    <div class="table-card" id="table-container">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th style="width: 45px;">#</th>
              <th>Word & Category</th>
              <th>Pronunciation & Audio</th>
              <th>Hindi Meaning (हिंदी अर्थ)</th>
              <th>English Meaning</th>
              <th>Textbook Example Sentence</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Dynamically populated rows -->
          </tbody>
        </table>
      </div>
    </div>

    <!-- Mode 2: Flashcard Grid View -->
    <div class="grid-view" id="grid-container" style="display: none;">
      <!-- Dynamically populated cards -->
    </div>

    <!-- Mode 3: Raw JSON Viewer -->
    <div class="json-card" id="json-container" style="display: none;">
      <pre><code id="json-display"></code></pre>
    </div>
  </main>

  <!-- Toast -->
  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    // Chapter mapping for Class 8 History
    const BOOKS_CONFIG = {
      class_08: {
        id: "class_08",
        title: "Class 8 History",
        subtitle: "Our Pasts - III • Interactive Vocabulary Table",
        tag: "Class 8 History",
        badge: "✨ Class 8 History NCERT",
        icon: "📖",
        totalPages: 124,
        getData: () => window.CLASS_08_DATA,
        fetchUrl: './datasets/class_08_history_our_pasts_iii.json',
        chapters: [
          { start: 1, end: 12, title: "Prelims & Contents Overview" },
          { start: 13, end: 20, title: "Chapter 1: How, When and Where" },
          { start: 21, end: 37, title: "Chapter 2: From Trade to Territory" },
          { start: 38, end: 50, title: "Chapter 3: Ruling the Countryside" },
          { start: 51, end: 62, title: "Chapter 4: Tribals, Dikus and Golden Age" },
          { start: 63, end: 76, title: "Chapter 5: When People Rebel (1857 & After)" },
          { start: 77, end: 89, title: "Chapter 6: Civilising the Native, Educating Nation" },
          { start: 90, end: 104, title: "Chapter 7: Women, Caste and Reform" },
          { start: 105, end: 124, title: "Chapter 8: The Making of the National Movement" }
        ]
      },
      class_09: {
        id: "class_09",
        title: "Class 9 English",
        subtitle: "Kaveri • Interactive Vocabulary Table",
        tag: "Class 9 English",
        badge: "✨ Class 9 English (Kaveri) NCERT",
        icon: "📙",
        totalPages: 276,
        getData: () => window.CLASS_09_ENGLISH_KAVERI_DATA || window.CLASS_CLASS_09_ENGLISH_KAVERI_DATA,
        fetchUrl: './datasets/class_09_english_kaveri.json',
        chapters: [
          { start: 1, end: 18, title: "Prelims & Foreword" },
          { start: 19, end: 40, title: "Unit 1: How I Taught My Grandmother to Read" },
          { start: 41, end: 50, title: "Unit 1 Poem: Bharat Our Land" },
          { start: 51, end: 74, title: "Unit 2: The Pot Maker" },
          { start: 75, end: 88, title: "Unit 2 Poem: Gifts of Grace" },
          { start: 89, end: 103, title: "Unit 3: Winds of Change" },
          { start: 104, end: 114, title: "Unit 3 Poem: Canvas of Soil" },
          { start: 115, end: 144, title: "Unit 4: Vitamin-M" },
          { start: 145, end: 155, title: "Unit 4 Poem: I Cannot Remember My Mother" },
          { start: 156, end: 173, title: "Unit 5: The World of Limitless Possibilities" },
          { start: 174, end: 186, title: "Unit 5 Poem: Nine Gold Medals" },
          { start: 187, end: 202, title: "Unit 6: Twin Melodies" },
          { start: 203, end: 220, title: "Unit 6 Poem: A Friend Found in Music" },
          { start: 221, end: 237, title: "Unit 7: Carrier of Words" },
          { start: 238, end: 249, title: "Unit 7 Poem: Words" },
          { start: 250, end: 262, title: "Unit 8: Follow That Dream" },
          { start: 263, end: 276, title: "Unit 8 Poem: Believe in Yourself" }
        ]
      }
    };

    let activeBookKey = 'class_08';
    let currentBookConfig = BOOKS_CONFIG[activeBookKey];
    let CHAPTERS = currentBookConfig.chapters;

    let dataset = null;
    let currentPage = 1;
    let totalPages = 124;
    let currentFilter = 'all';
    let currentView = 'table';

    // Elements
    const bookSelect = document.getElementById('book-select');
    const classTagBadge = document.getElementById('class-tag-badge');
    const brandSub = document.getElementById('brand-sub');
    const brandIcon = document.getElementById('brand-icon');
    const bookStatBadge = document.getElementById('book-stat-badge');
    const pageInput = document.getElementById('page-input');
    const maxPageLabel = document.getElementById('max-page-label');
    const chapterTitle = document.getElementById('chapter-title');
    const pageStatBadge = document.getElementById('page-stat-badge');
    const wordsStatBadge = document.getElementById('words-stat-badge');
    const tableBody = document.getElementById('table-body');
    const tableContainer = document.getElementById('table-container');
    const gridContainer = document.getElementById('grid-container');
    const jsonContainer = document.getElementById('json-container');
    const jsonDisplay = document.getElementById('json-display');
    const searchInput = document.getElementById('search-input');
    const searchPopover = document.getElementById('search-popover');
    const toast = document.getElementById('toast');

    // Filter Buttons
    const pillAll = document.getElementById('pill-all');
    const pillMed = document.getElementById('pill-med');
    const pillHard = document.getElementById('pill-hard');

    // Load Data
    async function switchBook(bookKey, targetPage = 1) {
      if (!BOOKS_CONFIG[bookKey]) return;
      activeBookKey = bookKey;
      currentBookConfig = BOOKS_CONFIG[bookKey];
      CHAPTERS = currentBookConfig.chapters;
      
      if (bookSelect) bookSelect.value = bookKey;
      if (classTagBadge) classTagBadge.textContent = currentBookConfig.tag;
      if (brandSub) brandSub.textContent = currentBookConfig.subtitle;
      if (brandIcon) brandIcon.textContent = currentBookConfig.icon;
      if (bookStatBadge) bookStatBadge.textContent = currentBookConfig.badge;

      // Reset dataset
      dataset = null;
      const inlineData = currentBookConfig.getData();
      if (inlineData && inlineData.pages) {
        dataset = inlineData;
      } else {
        try {
          const res = await fetch(currentBookConfig.fetchUrl);
          dataset = await res.json();
        } catch (e) {
          console.error("Could not fetch dataset for " + bookKey, e);
        }
      }

      totalPages = (dataset && dataset.total_pages) ? dataset.total_pages : currentBookConfig.totalPages;
      maxPageLabel.textContent = totalPages;
      pageInput.max = totalPages;

      // Find first page that has data if page 1 is empty
      if (dataset && dataset.pages) {
        const availablePages = Object.keys(dataset.pages).map(Number).sort((a,b) => a-b);
        if (targetPage === 1 && !dataset.pages[1] && availablePages.length > 0) {
          currentPage = availablePages[0];
        } else {
          currentPage = Math.min(Math.max(1, targetPage), totalPages);
        }
      } else {
        currentPage = targetPage;
      }

      renderPage();
    }

    async function loadData() {
      const urlParams = new URLSearchParams(window.location.search);
      const requestedBook = urlParams.get('book') || 'class_08';
      const requestedPage = parseInt(urlParams.get('page')) || 1;

      if (bookSelect) {
        bookSelect.addEventListener('change', (e) => {
          switchBook(e.target.value, 1);
        });
      }

      await switchBook(requestedBook, requestedPage);
    }

    function renderPage() {
      pageInput.value = currentPage;
      pageStatBadge.textContent = `📄 Page ${currentPage} of ${totalPages}`;

      // Update Chapter Info
      const ch = CHAPTERS.find(c => currentPage >= c.start && currentPage <= c.end);
      chapterTitle.textContent = ch ? `📖 ${ch.title}` : `Class 8 History (Page ${currentPage})`;

      // Navigation button states
      document.getElementById('btn-prev').disabled = (currentPage <= 1);
      document.getElementById('btn-first').disabled = (currentPage <= 1);
      document.getElementById('btn-next').disabled = (currentPage >= totalPages);
      document.getElementById('btn-last').disabled = (currentPage >= totalPages);

      const pageStr = String(currentPage);
      const allWords = (dataset && dataset.pages && dataset.pages[pageStr]) ? dataset.pages[pageStr] : [];

      // Update Counts
      const medCount = allWords.filter(w => (w.category || '').toLowerCase() === 'medium').length;
      const hardCount = allWords.filter(w => (w.category || '').toLowerCase() === 'hard').length;
      wordsStatBadge.textContent = `📝 ${allWords.length} Words on Page ${currentPage}`;
      pillAll.textContent = `All Words (${allWords.length})`;
      pillMed.textContent = `Medium (${medCount})`;
      pillHard.textContent = `Hard (${hardCount})`;

      // Filter
      const displayWords = allWords.filter(w => {
        if (currentFilter === 'all') return true;
        return (w.category || '').toLowerCase() === currentFilter.toLowerCase();
      });

      // Update JSON View
      jsonDisplay.textContent = JSON.stringify(displayWords, null, 2);

      // Render Table
      renderTable(displayWords);

      // Render Cards
      renderCards(displayWords);
    }

    // Render Table View
    function renderTable(words) {
      if (!words || words.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td colspan="6">
              <div class="empty-state">
                <div class="empty-icon">📄</div>
                <div style="font-weight:700; color:#fff; font-size:16px;">No vocabulary extracted on Page ${currentPage}</div>
                <div style="font-size:13px;">This page may be an illustration, title leaf, or map page without extensive text.</div>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tableBody.innerHTML = words.map((w, i) => {
        const cat = w.category || 'Medium';
        const pos = w.pos || 'noun';
        const ipa = w.pronunciation || '';
        const hindiPron = w.pronunciation_hindi || '';
        const hindiMeaning = w.hindi_meaning || '';
        const engMeaning = w.english_meaning || '';
        const example = w.example || '';

        // Highlight word in example
        let highlighted = example;
        if (w.word && example) {
          const reg = new RegExp(`\\b(${w.word})\\b`, 'gi');
          highlighted = example.replace(reg, '<strong>$1</strong>');
        }

        return `
          <tr>
            <td class="td-num">${i + 1}</td>
            <td>
              <div class="word-cell">
                <div class="word-name">${escapeHtml(w.word)}</div>
                <div class="word-tags">
                  <span class="category-badge ${cat}">${cat}</span>
                  <span class="pos-pill">${escapeHtml(pos)}</span>
                </div>
              </div>
            </td>
            <td>
              <div class="pron-cell">
                ${ipa ? `<span class="ipa-text">${escapeHtml(ipa)}</span>` : ''}
                ${hindiPron ? `<span class="pron-hindi-text">${escapeHtml(hindiPron)}</span>` : ''}
                <button class="btn-audio" onclick="speakWord('${escapeJs(w.word)}')">
                  🔊 Listen
                </button>
              </div>
            </td>
            <td>
              <div class="hindi-meaning-cell">${escapeHtml(hindiMeaning)}</div>
            </td>
            <td>
              <div class="english-meaning-cell">${escapeHtml(engMeaning)}</div>
            </td>
            <td>
              <div class="example-cell">"${highlighted}"</div>
            </td>
          </tr>
        `;
      }).join('');
    }

    // Render Cards View
    function renderCards(words) {
      if (!words || words.length === 0) {
        gridContainer.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            <div class="empty-icon">📄</div>
            <div style="font-weight:700; color:#fff;">No words on Page ${currentPage}</div>
          </div>
        `;
        return;
      }

      gridContainer.innerHTML = words.map((w, i) => {
        const cat = w.category || 'Medium';
        const pos = w.pos || 'noun';
        let highlighted = w.example || '';
        if (w.word && highlighted) {
          const reg = new RegExp(`\\b(${w.word})\\b`, 'gi');
          highlighted = highlighted.replace(reg, '<strong>$1</strong>');
        }

        return `
          <div class="vocab-card">
            <div class="card-top">
              <div>
                <span style="font-size:18px; font-weight:800; color:#fff;">${i+1}. ${escapeHtml(w.word)}</span>
                <span class="pos-pill" style="margin-left:6px;">${escapeHtml(pos)}</span>
              </div>
              <span class="category-badge ${cat}">${cat}</span>
            </div>

            <div style="display:flex; align-items:center; gap:8px; font-size:12.5px;">
              ${w.pronunciation ? `<span class="ipa-text">${escapeHtml(w.pronunciation)}</span>` : ''}
              ${w.pronunciation_hindi ? `<span class="pron-hindi-text">${escapeHtml(w.pronunciation_hindi)}</span>` : ''}
              <button class="btn-audio" onclick="speakWord('${escapeJs(w.word)}')">🔊 Listen</button>
            </div>

            <div style="background:rgba(15,23,42,0.5); padding:10px 14px; border-radius:8px; border-left:3px solid #f59e0b;">
              <div class="hindi-meaning-cell" style="font-size:16px;">${escapeHtml(w.hindi_meaning)}</div>
              <div class="english-meaning-cell" style="margin-top:4px;">${escapeHtml(w.english_meaning)}</div>
            </div>

            ${highlighted ? `<div class="example-cell">"${highlighted}"</div>` : ''}
          </div>
        `;
      }).join('');
    }

    // Text to Speech
    window.speakWord = function(word) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(word);
        utter.lang = 'en-US';
        utter.rate = 0.9;
        window.speechSynthesis.speak(utter);
      }
    };

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function escapeJs(str) {
      if (!str) return '';
      return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    // Go to Page
    function goToPage(p) {
      const target = Math.max(1, Math.min(totalPages, parseInt(p) || 1));
      currentPage = target;
      // Update browser history query param without reload
      const newUrl = new URL(window.location);
      newUrl.searchParams.set('page', currentPage);
      window.history.pushState({}, '', newUrl);
      renderPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Navigation Listeners
    document.getElementById('btn-prev').addEventListener('click', () => goToPage(currentPage - 1));
    document.getElementById('btn-next').addEventListener('click', () => goToPage(currentPage + 1));
    document.getElementById('btn-first').addEventListener('click', () => goToPage(1));
    document.getElementById('btn-last').addEventListener('click', () => goToPage(totalPages));
    document.getElementById('btn-go').addEventListener('click', () => goToPage(pageInput.value));
    pageInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') goToPage(pageInput.value);
    });

    // Keyboard Arrow Keys
    window.addEventListener('keydown', (e) => {
      if (document.activeElement.tagName === 'INPUT') return;
      if (e.key === 'ArrowLeft') goToPage(currentPage - 1);
      if (e.key === 'ArrowRight') goToPage(currentPage + 1);
      if (e.key === '/' || (e.ctrlKey && e.key === 'k')) {
        e.preventDefault();
        searchInput.focus();
      }
    });

    // Filter Buttons
    [pillAll, pillMed, pillHard].forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        currentFilter = b.dataset.filter;
        renderPage();
      });
    });

    // View Switcher
    const viewTableBtn = document.getElementById('view-table-btn');
    const viewCardsBtn = document.getElementById('view-cards-btn');
    const viewJsonBtn = document.getElementById('view-json-btn');

    viewTableBtn.addEventListener('click', () => switchView('table'));
    viewCardsBtn.addEventListener('click', () => switchView('cards'));
    viewJsonBtn.addEventListener('click', () => switchView('json'));

    function switchView(view) {
      currentView = view;
      [viewTableBtn, viewCardsBtn, viewJsonBtn].forEach(b => b.classList.remove('active'));
      tableContainer.style.display = 'none';
      gridContainer.style.display = 'none';
      jsonContainer.style.display = 'none';

      if (view === 'table') {
        viewTableBtn.classList.add('active');
        tableContainer.style.display = 'block';
      } else if (view === 'cards') {
        viewCardsBtn.classList.add('active');
        gridContainer.style.display = 'grid';
      } else if (view === 'json') {
        viewJsonBtn.classList.add('active');
        jsonContainer.style.display = 'block';
      }
    }

    // Copy Page JSON
    document.getElementById('btn-copy-page').addEventListener('click', () => {
      navigator.clipboard.writeText(jsonDisplay.textContent).then(() => {
        showToast(`Copied Page ${currentPage} JSON!`);
      });
    });

    // Download Full Dataset
    document.getElementById('btn-download-all').addEventListener('click', () => {
      if (!dataset) return;
      const blob = new Blob([JSON.stringify(dataset, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'Class_08_History_Vocabulary.json';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Downloading full Class 8 JSON dataset...');
    });

    // Toast
    function showToast(msg) {
      toast.textContent = msg;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2200);
    }

    // Global Search
    searchInput.addEventListener('input', (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q || !dataset || !dataset.pages) {
        searchPopover.style.display = 'none';
        return;
      }

      const matches = [];
      for (const [pNum, words] of Object.entries(dataset.pages)) {
        if (!Array.isArray(words)) continue;
        for (const w of words) {
          if ((w.word && w.word.toLowerCase().includes(q)) ||
              (w.hindi_meaning && w.hindi_meaning.includes(q)) ||
              (w.english_meaning && w.english_meaning.toLowerCase().includes(q))) {
            matches.push({ page: parseInt(pNum), ...w });
            if (matches.length >= 25) break;
          }
        }
        if (matches.length >= 25) break;
      }

      if (matches.length === 0) {
        searchPopover.innerHTML = `<div style="padding:16px; text-align:center; color:#94a3b8; font-size:13px;">No words found matching "${escapeHtml(q)}"</div>`;
      } else {
        searchPopover.innerHTML = matches.map(m => `
          <div class="search-item" onclick="goToPage(${m.page}); searchPopover.style.display='none'; searchInput.value='';">
            <div class="search-item-header">
              <span class="search-item-word">${escapeHtml(m.word)}</span>
              <span class="search-item-page">Page ${m.page}</span>
            </div>
            <div class="search-item-hindi">${escapeHtml(m.hindi_meaning)}</div>
          </div>
        `).join('');
      }

      searchPopover.style.display = 'block';
    });

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.search-wrapper') && !e.target.closest('.search-results-popover')) {
        searchPopover.style.display = 'none';
      }
    });

    // Start
    window.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
