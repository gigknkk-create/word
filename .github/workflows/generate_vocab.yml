name: NCERT Vocab Auto-Generator on Upload

on:
  push:
    paths:
      - 'books/**.pdf'
  workflow_dispatch:
    inputs:
      book_choice:
        description: 'Specific Book to Generate (or "auto" for newly uploaded/missing)'
        required: false
        default: 'auto'
      words_per_page:
        description: 'Target Words Per Page'
        required: false
        default: '10'

permissions:
  contents: write

jobs:
  auto_generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pymupdf requests

      - name: Run Auto Vocabulary Generator
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SPECIFIC_BOOK: ${{ github.event.inputs.book_choice || 'auto' }}
          WORDS_PER_PAGE: ${{ github.event.inputs.words_per_page || '10' }}
        run: |
          python scripts/auto_runner.py

      - name: Commit and Push Generated Datasets
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add datasets/
          if git diff --staged --quiet; then
            echo "No new datasets to commit."
          else
            git commit -m "feat(vocab): auto-generate vocabulary dataset on book upload [skip ci]"
            git push origin HEAD
          fi
